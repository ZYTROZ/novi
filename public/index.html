<script>
    const API_URL = "https://novi-1.onrender.com";

    function focusKey() {
        const input = document.getElementById("keyInput");

        if (!input) return;

        input.focus();

        input.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });
    }

    async function unlock() {
        const input = document.getElementById("keyInput");
        const message = document.getElementById("message");
        const button = document.getElementById("unlockButton");

        if (!input || !message || !button) {
            return;
        }

        const key = input.value.trim().toUpperCase();

        if (!key) {
            message.textContent =
                "Please enter your Novi access key.";

            message.className =
                "message error";

            input.focus();

            return;
        }

        button.disabled = true;
        button.textContent = "Verifying...";

        message.textContent =
            "Checking your Novi access key...";

        message.className = "message";

        try {
            const response = await fetch(
                `${API_URL}/api/verify`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        key: key
                    })
                }
            );

            if (!response.ok) {
                throw new Error(
                    "Server returned " + response.status
                );
            }

            const result = await response.json();

            if (result.valid) {
                message.textContent = "Access granted.";
                message.className = "message success";

                const durationNames = {
                    "1d": "1 Day",
                    "1week": "1 Week",
                    "1month": "1 Month",
                    "1year": "1 Year",
                    "lifetime": "Lifetime"
                };

                const duration =
                    durationNames[result.duration] ||
                    result.duration ||
                    "Unknown";

                setTimeout(function() {
                    const loginPage =
                        document.getElementById("loginPage");

                    const dashboard =
                        document.getElementById("dashboard");

                    const displayKey =
                        document.getElementById("displayKey");

                    const displayDuration =
                        document.getElementById("displayDuration");

                    loginPage.style.display = "none";
                    dashboard.style.display = "block";

                    displayKey.textContent = key;
                    displayDuration.textContent = duration;

                    window.scrollTo({
                        top: 0,
                        behavior: "smooth"
                    });
                }, 500);

                return;
            }

            message.textContent =
                result.message ||
                "Invalid or expired Novi key.";

            message.className = "message error";
            input.focus();

        } catch (error) {
            console.error("Novi API Error:", error);

            message.textContent =
                "Unable to connect to the Novi server.";

            message.className = "message error";

        } finally {
            button.disabled = false;
            button.textContent = "Unlock Access";
        }
    }

    function logout() {
        const dashboard =
            document.getElementById("dashboard");

        const loginPage =
            document.getElementById("loginPage");

        const input =
            document.getElementById("keyInput");

        const message =
            document.getElementById("message");

        dashboard.style.display = "none";
        loginPage.style.display = "block";

        input.value = "";
        message.textContent = "";
        message.className = "message";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

        setTimeout(function() {
            input.focus();
        }, 300);
    }

    document
        .getElementById("keyInput")
        .addEventListener(
            "keydown",
            function(event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    unlock();
                }
            }
        );
</script>
