<style>
  /* =========================================================
     NOVI — PREMIUM DARK UI
     DESIGN ONLY — DO NOT CHANGE HTML / JAVASCRIPT
  ========================================================= */

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --bg: #050507;
    --bg2: #08080c;
    --panel: rgba(14, 14, 19, .78);
    --panel2: rgba(18, 18, 25, .88);

    --line: rgba(255,255,255,.07);
    --line-hover: rgba(167,139,250,.24);

    --text: #f8f7fb;
    --soft: #c9c6d2;
    --muted: #777481;
    --muted2: #4e4b57;

    --purple: #8b5cf6;
    --purple-light: #b79aff;
    --purple-dark: #6d28d9;

    --green: #4ade80;
    --red: #f87171;

    --radius: 20px;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    min-height: 100vh;
    overflow-x: hidden;

    color: var(--text);

    font-family:
      Inter,
      ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;

    background:
      radial-gradient(
        800px 500px at 50% -20%,
        rgba(124,58,237,.22),
        transparent 70%
      ),
      radial-gradient(
        600px 500px at 100% 100%,
        rgba(109,40,217,.09),
        transparent 70%
      ),
      radial-gradient(
        500px 400px at -15% 50%,
        rgba(139,92,246,.06),
        transparent 70%
      ),
      #050507;
  }

  body::before {
    content: "";

    position: fixed;
    inset: 0;

    pointer-events: none;

    background-image:
      linear-gradient(
        rgba(255,255,255,.018) 1px,
        transparent 1px
      ),
      linear-gradient(
        90deg,
        rgba(255,255,255,.018) 1px,
        transparent 1px
      );

    background-size: 70px 70px;

    mask-image:
      linear-gradient(
        to bottom,
        black,
        transparent 85%
      );

    opacity: .35;
  }

  body::after {
    content: "";

    position: fixed;

    width: 600px;
    height: 600px;

    left: 50%;
    top: 45%;

    transform: translate(-50%, -50%);

    background: rgba(124,58,237,.035);

    filter: blur(140px);

    border-radius: 50%;

    pointer-events: none;
  }

  button,
  input {
    font: inherit;
  }

  button {
    cursor: pointer;
  }

  .hidden {
    display: none !important;
  }


  /* =========================================================
     LOGIN
  ========================================================= */

  #loginPage {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 30px 20px;

    position: relative;
  }

  .login-wrapper {
    width: 100%;
    max-width: 420px;

    position: relative;
    z-index: 2;

    animation: loginEnter .65s ease both;
  }

  @keyframes loginEnter {
    from {
      opacity: 0;
      transform: translateY(18px) scale(.985);
    }

    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .login-wrapper::before {
    content: "";

    position: absolute;

    width: 360px;
    height: 360px;

    left: 50%;
    top: 40px;

    transform: translateX(-50%);

    background: rgba(124,58,237,.16);

    filter: blur(120px);

    border-radius: 50%;

    z-index: -1;
  }


  /* =========================================================
     BRAND
  ========================================================= */

  .brand {
    text-align: center;
    margin-bottom: 25px;
  }

  .brand-logo {
    width: 64px;
    height: 64px;

    margin: 0 auto 17px;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    border-radius: 18px;

    color: white;

    font-size: 23px;
    font-weight: 900;

    background:
      linear-gradient(
        145deg,
        #b9a1ff,
        #8b5cf6 48%,
        #5b21b6
      );

    border: 1px solid rgba(255,255,255,.18);

    box-shadow:
      0 0 0 7px rgba(139,92,246,.025),
      0 20px 65px rgba(109,40,217,.35),
      inset 0 1px 1px rgba(255,255,255,.4);

    overflow: hidden;
  }

  .brand-logo::before {
    content: "";

    position: absolute;

    width: 120px;
    height: 25px;

    top: 4px;
    left: -35px;

    transform: rotate(-35deg);

    background: rgba(255,255,255,.2);

    filter: blur(7px);
  }

  .brand h1 {
    font-size: 36px;
    line-height: 1;

    font-weight: 850;

    letter-spacing: -2px;

    background:
      linear-gradient(
        180deg,
        #fff,
        #cbc5d8
      );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
  }

  .brand p {
    margin-top: 9px;

    color: var(--muted);

    font-size: 11px;
    font-weight: 500;

    letter-spacing: .2px;
  }


  /* =========================================================
     LOGIN CARD
  ========================================================= */

  .login-card {
    position: relative;

    padding: 28px;

    border: 1px solid var(--line);

    border-radius: 22px;

    background:
      linear-gradient(
        145deg,
        rgba(20,20,27,.91),
        rgba(8,8,12,.88)
      );

    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);

    box-shadow:
      0 40px 100px rgba(0,0,0,.55),
      0 10px 35px rgba(0,0,0,.25),
      inset 0 1px 0 rgba(255,255,255,.04);

    overflow: hidden;
  }

  .login-card::before {
    content: "";

    position: absolute;

    top: 0;
    left: 18%;
    right: 18%;

    height: 1px;

    background:
      linear-gradient(
        90deg,
        transparent,
        rgba(167,139,250,.9),
        transparent
      );

    box-shadow:
      0 0 20px rgba(139,92,246,.5);
  }

  .login-card::after {
    content: "";

    position: absolute;

    width: 220px;
    height: 220px;

    right: -140px;
    top: -140px;

    border-radius: 50%;

    background: rgba(139,92,246,.12);

    filter: blur(55px);

    pointer-events: none;
  }

  .login-heading {
    margin-bottom: 24px;
  }

  .login-title {
    color: #f7f6fa;

    font-size: 20px;
    font-weight: 750;

    letter-spacing: -.5px;
  }

  .login-description {
    margin-top: 8px;

    color: var(--muted);

    font-size: 11px;
    line-height: 1.7;
  }


  /* =========================================================
     INPUT
  ========================================================= */

  .input-group {
    position: relative;
  }

  .input-label {
    display: block;

    margin-bottom: 8px;

    color: #96929f;

    font-size: 9px;
    font-weight: 800;

    letter-spacing: 1px;

    text-transform: uppercase;
  }

  .key-input {
    width: 100%;
    height: 53px;

    padding: 0 15px;

    outline: none;

    border: 1px solid rgba(255,255,255,.065);

    border-radius: 12px;

    color: #fff;

    background:
      rgba(255,255,255,.025);

    font-size: 12px;
    font-weight: 600;

    letter-spacing: .25px;

    transition:
      .2s ease;
  }

  .key-input:hover {
    border-color: rgba(255,255,255,.12);

    background:
      rgba(255,255,255,.035);
  }

  .key-input:focus {
    border-color: rgba(139,92,246,.65);

    background:
      rgba(139,92,246,.045);

    box-shadow:
      0 0 0 4px rgba(139,92,246,.07),
      0 10px 30px rgba(0,0,0,.2);
  }

  .key-input::placeholder {
    color: #4b4853;
  }


  /* =========================================================
     BUTTONS
  ========================================================= */

  .unlock-button,
  .generate-button {
    position: relative;

    border: 0;

    color: white;

    background:
      linear-gradient(
        135deg,
        #a78bfa,
        #7c3aed 48%,
        #5b21b6
      );

    box-shadow:
      0 12px 35px rgba(109,40,217,.25),
      inset 0 1px 0 rgba(255,255,255,.23);

    overflow: hidden;

    transition:
      transform .2s ease,
      box-shadow .2s ease,
      filter .2s ease;
  }

  .unlock-button::before,
  .generate-button::before {
    content: "";

    position: absolute;

    top: 0;
    bottom: 0;

    left: -100%;

    width: 55%;

    transform: skewX(-20deg);

    background:
      linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.2),
        transparent
      );

    transition: left .55s ease;
  }

  .unlock-button:hover,
  .generate-button:hover {
    transform: translateY(-2px);

    filter: brightness(1.06);

    box-shadow:
      0 18px 45px rgba(109,40,217,.38),
      inset 0 1px 0 rgba(255,255,255,.27);
  }

  .unlock-button:hover::before,
  .generate-button:hover::before {
    left: 140%;
  }

  .unlock-button:active,
  .generate-button:active {
    transform: translateY(0);
  }

  .unlock-button:disabled,
  .generate-button:disabled {
    opacity: .55;
    cursor: not-allowed;
    transform: none;
  }

  .unlock-button {
    width: 100%;
    height: 53px;

    margin-top: 11px;

    border-radius: 12px;

    font-size: 11px;
    font-weight: 800;

    letter-spacing: .1px;
  }


  /* =========================================================
     VERIFY
  ========================================================= */

  #verifyResult {
    margin-top: 12px;

    padding: 11px 12px;

    border-radius: 10px;

    font-size: 10px;

    line-height: 1.5;

    display: none;
  }

  #verifyResult.error {
    display: block;

    color: #fca5a5;

    background: rgba(239,68,68,.055);

    border: 1px solid rgba(239,68,68,.13);
  }

  #verifyResult.success {
    display: block;

    color: #86efac;

    background: rgba(34,197,94,.055);

    border: 1px solid rgba(34,197,94,.13);
  }


  /* =========================================================
     SERVER STATUS
  ========================================================= */

  .server-status {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 8px;

    margin-top: 17px;

    color: #62606a;

    font-size: 9px;
    font-weight: 600;
  }

  .status-dot {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: var(--green);

    box-shadow:
      0 0 0 4px rgba(74,222,128,.05),
      0 0 15px rgba(74,222,128,.7);

    animation: statusPulse 2s ease-in-out infinite;
  }

  @keyframes statusPulse {
    0%,100% {
      opacity: 1;
    }

    50% {
      opacity: .45;
    }
  }


  /* =========================================================
     DASHBOARD
  ========================================================= */

  #dashboardPage {
    min-height: 100vh;

    padding: 22px;

    position: relative;
  }

  .dashboard-container {
    width: 100%;
    max-width: 1150px;

    margin: 0 auto;

    position: relative;
    z-index: 2;
  }


  /* =========================================================
     TOPBAR
  ========================================================= */

  .topbar {
    height: 64px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    padding: 0 10px 0 14px;

    margin-bottom: 42px;

    border: 1px solid var(--line);

    border-radius: 17px;

    background:
      rgba(9,9,13,.72);

    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);

    box-shadow:
      0 18px 55px rgba(0,0,0,.3),
      inset 0 1px 0 rgba(255,255,255,.035);
  }

  .topbar-brand {
    display: flex;

    align-items: center;

    gap: 10px;

    color: #f4f2f8;

    font-size: 13px;
    font-weight: 800;
  }

  .small-logo {
    width: 36px;
    height: 36px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 11px;

    color: white;

    font-size: 12px;
    font-weight: 900;

    background:
      linear-gradient(
        135deg,
        #a78bfa,
        #6d28d9
      );

    border: 1px solid rgba(255,255,255,.13);

    box-shadow:
      0 8px 25px rgba(109,40,217,.3),
      inset 0 1px 0 rgba(255,255,255,.22);
  }

  .logout-button {
    height: 36px;

    padding: 0 14px;

    border-radius: 10px;

    border: 1px solid rgba(255,255,255,.06);

    color: #85818e;

    font-size: 9px;
    font-weight: 750;

    background:
      rgba(255,255,255,.025);

    transition: .2s ease;
  }

  .logout-button:hover {
    color: white;

    border-color:
      rgba(255,255,255,.12);

    background:
      rgba(255,255,255,.06);

    transform: translateY(-1px);
  }


  /* =========================================================
     WELCOME
  ========================================================= */

  .welcome {
    margin-bottom: 23px;
  }

  .welcome h2 {
    font-size: 34px;

    font-weight: 850;

    letter-spacing: -1.7px;

    background:
      linear-gradient(
        180deg,
        #fff,
        #c9c4d3
      );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
  }

  .welcome p {
    margin-top: 7px;

    color: var(--muted);

    font-size: 11px;
  }


  /* =========================================================
     STATS
  ========================================================= */

  .stats-grid {
    display: grid;

    grid-template-columns:
      repeat(3, 1fr);

    gap: 12px;

    margin-bottom: 13px;
  }

  .stat-card {
    min-height: 120px;

    padding: 20px;

    position: relative;

    border: 1px solid var(--line);

    border-radius: 17px;

    background:
      linear-gradient(
        145deg,
        rgba(17,17,23,.82),
        rgba(9,9,13,.78)
      );

    overflow: hidden;

    transition:
      transform .22s ease,
      border-color .22s ease,
      box-shadow .22s ease;
  }

  .stat-card::before {
    content: "";

    position: absolute;

    width: 180px;
    height: 180px;

    right: -120px;
    bottom: -125px;

    border-radius: 50%;

    background:
      rgba(139,92,246,.16);

    filter: blur(40px);
  }

  .stat-card:hover {
    transform: translateY(-3px);

    border-color:
      rgba(139,92,246,.22);

    box-shadow:
      0 20px 45px rgba(0,0,0,.28);
  }

  .stat-label {
    color: #6e6b77;

    font-size: 8px;
    font-weight: 800;

    letter-spacing: 1px;

    text-transform: uppercase;
  }

  .stat-value {
    margin-top: 12px;

    color: #f6f5f8;

    font-size: 28px;
    line-height: 1;

    font-weight: 850;

    letter-spacing: -1.2px;
  }

  #accountStatus {
    color: #86efac;

    text-shadow:
      0 0 20px rgba(74,222,128,.12);
  }


  /* =========================================================
     MAIN INVENTORY CARD
  ========================================================= */

  .main-card {
    position: relative;

    padding: 25px;

    border: 1px solid var(--line);

    border-radius: 19px;

    background:
      linear-gradient(
        145deg,
        rgba(17,17,23,.86),
        rgba(9,9,13,.82)
      );

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    box-shadow:
      0 30px 80px rgba(0,0,0,.3),
      inset 0 1px 0 rgba(255,255,255,.03);

    overflow: hidden;
  }

  .main-card::before {
    content: "";

    position: absolute;

    top: 0;
    left: 15%;
    right: 15%;

    height: 1px;

    background:
      linear-gradient(
        90deg,
        transparent,
        rgba(139,92,246,.42),
        transparent
      );

    box-shadow:
      0 0 18px rgba(139,92,246,.3);
  }

  .card-header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 20px;

    margin-bottom: 20px;
  }

  .card-header h3 {
    color: #f4f2f8;

    font-size: 17px;
    font-weight: 780;

    letter-spacing: -.4px;
  }

  .card-header p {
    margin-top: 5px;

    color: var(--muted);

    font-size: 10px;
  }


  /* =========================================================
     GENERATE BUTTON
  ========================================================= */

  .generate-button {
    min-width: 145px;
    height: 42px;

    padding: 0 18px;

    border-radius: 11px;

    font-size: 10px;
    font-weight: 800;

    letter-spacing: .1px;
  }


  /* =========================================================
     INVENTORY RESULT
  ========================================================= */

  .inventory-result {
    min-height: 125px;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 20px;

    border: 1px dashed rgba(255,255,255,.075);

    border-radius: 14px;

    color: #5f5b67;

    background:
      linear-gradient(
        145deg,
        rgba(255,255,255,.015),
        rgba(255,255,255,.006)
      );

    text-align: center;

    font-size: 10px;

    transition: .2s ease;
  }

  .inventory-result:has(.item-box) {
    border-style: solid;

    border-color:
      rgba(139,92,246,.16);

    background:
      linear-gradient(
        145deg,
        rgba(139,92,246,.035),
        rgba(255,255,255,.008)
      );
  }

  .item-box {
    width: 100%;
  }

  .item-row {
    display: grid;

    grid-template-columns:
      repeat(2, 1fr);

    gap: 9px;
  }

  .item-field {
    padding: 14px;

    text-align: left;

    border:
      1px solid rgba(255,255,255,.055);

    border-radius: 12px;

    background:
      rgba(255,255,255,.018);

    transition: .2s ease;
  }

  .item-field:hover {
    transform: translateY(-2px);

    border-color:
      rgba(139,92,246,.2);

    background:
      rgba(139,92,246,.035);

    box-shadow:
      0 10px 25px rgba(0,0,0,.15);
  }

  .item-field span {
    display: block;

    margin-bottom: 7px;

    color: #625e6b;

    font-size: 8px;
    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: .9px;
  }

  .item-field strong {
    display: block;

    word-break: break-word;

    color: #e5e2eb;

    font-size: 11px;
    font-weight: 600;

    line-height: 1.5;
  }


  /* =========================================================
     MESSAGES
  ========================================================= */

  .message {
    margin-top: 11px;

    padding: 11px 12px;

    border-radius: 10px;

    display: none;

    font-size: 10px;

    line-height: 1.5;
  }

  .message.error {
    display: block;

    color: #fca5a5;

    background:
      rgba(239,68,68,.05);

    border:
      1px solid rgba(239,68,68,.12);
  }

  .message.success {
    display: block;

    color: #86efac;

    background:
      rgba(34,197,94,.05);

    border:
      1px solid rgba(34,197,94,.12);
  }


  /* =========================================================
     MOBILE
  ========================================================= */

  @media (max-width: 700px) {

    #loginPage {
      padding: 22px 13px;
    }

    .brand-logo {
      width: 59px;
      height: 59px;

      border-radius: 17px;
    }

    .brand h1 {
      font-size: 32px;
    }

    .login-card {
      padding: 21px;

      border-radius: 19px;
    }

    #dashboardPage {
      padding: 10px;
    }

    .topbar {
      height: 59px;

      margin-bottom: 27px;

      border-radius: 15px;
    }

    .small-logo {
      width: 33px;
      height: 33px;
    }

    .welcome {
      margin-bottom: 20px;
    }

    .welcome h2 {
      font-size: 28px;
    }

    .stats-grid {
      grid-template-columns: 1fr;

      gap: 8px;
    }

    .stat-card {
      min-height: 96px;

      padding: 18px;
    }

    .stat-value {
      font-size: 25px;
    }

    .main-card {
      padding: 17px;

      border-radius: 16px;
    }

    .card-header {
      flex-direction: column;

      align-items: stretch;

      gap: 13px;
    }

    .generate-button {
      width: 100%;
    }

    .inventory-result {
      min-height: 105px;

      padding: 14px;
    }

    .item-row {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 380px) {

    #loginPage {
      padding: 16px 11px;
    }

    .login-card {
      padding: 18px;
    }

    .brand h1 {
      font-size: 29px;
    }

    .key-input,
    .unlock-button {
      height: 50px;
    }

    #dashboardPage {
      padding: 8px;
    }

    .welcome h2 {
      font-size: 25px;
    }

    .main-card {
      padding: 15px;
    }
  }
</style>
